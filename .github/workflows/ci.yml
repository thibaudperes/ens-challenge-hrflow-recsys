name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer uv
        uses: astral-sh/setup-uv@v7

      - name: Installer les dépendances
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Formatage (ruff)
        run: uv run ruff format --check .

      - name: Tests (pytest)
        run: uv run pytest
    docker:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Construire l'image
        run: docker build -t hrflow-api .
